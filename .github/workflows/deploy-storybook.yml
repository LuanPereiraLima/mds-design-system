name: Deploy Storybook

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Permissões exigidas pelo deploy do GitHub Pages via Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O CSS de tokens é gerado, não versionado (src/tokens/css/ está no
      # .gitignore), então precisa ser construído antes de qualquer build.
      - name: Gerar tokens
        run: npm run tokens:build

      - name: Type-check
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build do Storybook
        run: npm run build-storybook

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
